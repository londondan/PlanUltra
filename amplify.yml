version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@10
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
  environment:
    variables:
      AUTH_SECRET: $AUTH_SECRET
      AUTH_GOOGLE_ID: $AUTH_GOOGLE_ID
      AUTH_GOOGLE_SECRET: $AUTH_GOOGLE_SECRET
      AUTH_TRUST_HOST: $AUTH_TRUST_HOST
      AUTH_URL: $AUTH_URL
