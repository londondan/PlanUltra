<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PlanUltra Race Review{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Inline-edit: hide input by default, show on click */
    .editable { cursor: pointer; border-bottom: 1px dashed #94a3b8; }
    .editable:hover { background: #f1f5f9; }
    .edit-input { display: none; }
    .editing .editable { display: none; }
    .editing .edit-input { display: inline-block; }
    /* Severity colours */
    .sev-high   { color: #dc2626; }
    .sev-medium { color: #d97706; }
    .sev-low    { color: #6b7280; }
    /* Score badges */
    .badge-green  { background: #dcfce7; color: #166534; }
    .badge-amber  { background: #fef9c3; color: #854d0e; }
    .badge-red    { background: #fee2e2; color: #991b1b; }
    .badge-unknown{ background: #f1f5f9; color: #475569; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
  <nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center gap-4">
    <a href="/" class="font-semibold text-indigo-600 hover:text-indigo-800">PlanUltra</a>
    <span class="text-gray-400">/</span>
    <span class="text-gray-600">{% block nav_label %}Race Review{% endblock %}</span>
    <div class="ml-auto text-sm text-gray-400">localhost:8123</div>
  </nav>
  <main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
